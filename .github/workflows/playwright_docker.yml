name: Tests Com Docker e Python
on:
  - push

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  test-docker:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
      options: --user root
    
    env:
      HOME: /root

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Necessário para histórico do Allure
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g allure-commandline

      - name: Run Playwright tests (container)
        continue-on-error: true
        run: xvfb-run --auto-servernum -- pytest tests --alluredir=./output/allure
      
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} 
        with:
          name: playwright-traces
          path: test-results/
      
      - name: 📊 Collect Allure files and generate allure-report folder
        run: |
          allure generate ./output/allure -o allure-results/
      - name: 🎁 Publishing Allure artifact to GitHub Actions
        uses: actions/upload-artifact@v3
        with:
          name: my_reports
          path: my_reports
          
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages  # default: gh-pages
          publish_dir: allure-results
          destination_dir: allure-results